# =============================================================================
# Crane SEO Platform - Kejilion Nginx 站点配置
#
# 部署方式：
#   1. 复制此文件到 /home/web/conf.d/seo-platform.conf
#   2. 将 {YOUR_DOMAIN} 替换为实际域名
#   3. 执行: docker exec nginx nginx -t && docker exec nginx nginx -s reload
#
# 前端静态文件位置：/home/web/html/seo-platform/
# API 后端：localhost:8080 (Kejilion Nginx 使用 host 网络模式)
# =============================================================================

# ---------- HTTP (80) ----------
server {
    listen 80;
    listen [::]:80;
    server_name {YOUR_DOMAIN};

    # HTTPS 模式：强制跳转（部署时 SSL_MODE=https 保留此行，SSL_MODE=http 注释此行）
    # return 301 https://$host$request_uri;

    # 前端静态文件
    root /var/www/html/seo-platform;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    location /api-docs {
        proxy_pass http://127.0.0.1:8081/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs.json {
        proxy_pass http://127.0.0.1:8081/api-docs.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 50m;
    client_body_timeout 120s;
}

# ---------- HTTPS (443) 主站点 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;

    server_name {YOUR_DOMAIN};

    # ---- SSL 证书（使用 kejilion 统一证书路径）----
    ssl_certificate     /etc/nginx/certs/{YOUR_DOMAIN}_cert.pem;
    ssl_certificate_key /etc/nginx/certs/{YOUR_DOMAIN}_key.pem;

    # ---- 安全头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 日志 ----
    access_log /var/log/nginx/seo-platform-access.log;
    error_log  /var/log/nginx/seo-platform-error.log;

    # ---- 前端静态文件 ----
    root /var/www/html/seo-platform;
    index index.html;

    # ---- 静态资源缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（部分 API 如爬虫触发耗时较长）
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ---- API 文档 ----
    location /api-docs {
        proxy_pass http://127.0.0.1:8081/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api-docs.json {
        proxy_pass http://127.0.0.1:8081/api-docs.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 健康检查 ----
    location /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- SPA 路由回退（前端 React Router）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 上传限制 ----
    client_max_body_size 50m;
    client_body_timeout 120s;
}