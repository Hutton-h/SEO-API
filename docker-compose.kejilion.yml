# =============================================================================
# Crane SEO Platform - Kejilion Nginx 适配版 Docker Compose
#
# 适用场景：服务器已通过 kejilion.sh 安装了 Docker + Nginx 环境
# Nginx 使用 network_mode: host，通过 localhost 反向代理到本服务
# Redis 复用 kejilion 自带的 Redis 容器（localhost:6379）
# =============================================================================



services:
  # --- PostgreSQL 15 ---
  postgres:
    image: postgres:15-alpine
    container_name: crane-seo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crane_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crane_password}
      POSTGRES_DB: ${POSTGRES_DB:-crane_seo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crane_user} -d ${POSTGRES_DB:-crane_seo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crane-seo-net

  # --- API Server ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: crane-seo-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 48080
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-crane_user}:${POSTGRES_PASSWORD:-crane_password}@postgres:5432/${POSTGRES_DB:-crane_seo}
      REDIS_URL: redis://${KEJILION_REDIS_PASSWORD:-}@host.docker.internal:6379/1
      CORS_ORIGIN: ${DOMAIN:-http://localhost}
    ports:
      - "127.0.0.1:48080:48080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crane-seo-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Crawler Service ---
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: crane-seo-crawler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-crane_user}:${POSTGRES_PASSWORD:-crane_password}@postgres:5432/${POSTGRES_DB:-crane_seo}
      REDIS_URL: redis://${KEJILION_REDIS_PASSWORD:-}@host.docker.internal:6379/1
      CRAWLER_CONCURRENCY: ${CRAWLER_CONCURRENCY:-5}
      CRAWLER_MAX_REQUESTS_PER_MINUTE: ${CRAWLER_MAX_REQUESTS_PER_MINUTE:-60}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crane-seo-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local

networks:
  crane-seo-net:
    driver: bridge
    name: crane-seo-network